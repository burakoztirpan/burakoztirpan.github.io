<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get Habiproof – free home inspection app</title>
<meta name="description" content="Room-by-room snagging checklists, photo evidence and PDF reports for new-build handover. Free on iPhone and Android.">
<meta property="og:title" content="Habiproof: Home Inspection">
<meta property="og:description" content="Free snagging checklists and inspection reports for new-build buyers.">
<link rel="icon" href="images/habiproof-icon.svg" type="image/svg+xml">
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#F2F2F7; color:#17211F;
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif; text-align:center; padding:24px; box-sizing:border-box; }
  .card { background:#fff; border:1px solid #E4E8E6; border-radius:24px; padding:36px 28px; max-width:380px; width:100%; }
  img { width:84px; height:84px; border-radius:20px; }
  h1 { font-size:24px; margin:16px 0 6px; } p { color:#4B5A56; margin:0 0 24px; line-height:1.45; }
  a.btn { display:block; padding:16px; border-radius:14px; background:#0F766E; color:#fff; font-weight:700; text-decoration:none; margin:10px 0; font-size:17px; }
  a.alt { background:#fff; color:#0F766E; border:1.5px solid #0F766E; }
  small { color:#7C8A86; display:block; margin-top:16px; }
</style>
</head>
<body>
<div class="card">
  <img src="images/habiproof-icon.svg" alt="Habiproof">
  <h1>Habiproof</h1>
  <p>Snagging checklists, photo evidence and PDF reports for your new-build handover. Free to download.</p>
  <a class="btn" id="ios" href="https://apps.apple.com/gb/app/habiproof-home-inspection/id6797038152">Download on the App Store</a>
  <a class="btn alt" id="android" href="https://play.google.com/store/apps/details?id=com.burakoztirpan.habiproof&referrer=utm_source%3Dtiktok%26utm_medium%3Dbio">Get it on Google Play</a>
  <small>Opening your store…</small>
</div>
<script>
  // One link for TikTok bio: send each phone straight to its own store. Source is kept for attribution (?src=tiktok).
  var ua = navigator.userAgent || '';
  var src = new URLSearchParams(location.search).get('src') || 'tiktok';
  var ios = 'https://apps.apple.com/gb/app/habiproof-home-inspection/id6797038152?ct=' + encodeURIComponent(src);
  var android = 'https://play.google.com/store/apps/details?id=com.burakoztirpan.habiproof&referrer=' + encodeURIComponent('utm_source=' + src + '&utm_medium=bio');
  document.getElementById('ios').href = ios; document.getElementById('android').href = android;
  if (/iPhone|iPad|iPod/i.test(ua)) location.replace(ios);
  else if (/Android/i.test(ua)) location.replace(android);
</script>
</body>
</html>
