<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mekanik Saha Denetim Uygulaması</title>
<style>
  :root {
    --bg-main: #0f172a;
    --card-bg: #1e293b;
    --card-border: #334155;
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --accent-blue: #3b82f6;
    --accent-blue-hover: #2563eb;
    --success: #22c55e;
    --danger: #ef4444;
    --warning: #f59e0b;
  }

  body { 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
    background-color: var(--bg-main); 
    margin: 0; 
    padding: 12px; 
    color: var(--text-primary); 
    -webkit-font-smoothing: antialiased;
  }

  .app-header {
    text-align: center;
    padding: 12px 0 16px 0;
    border-bottom: 1px solid var(--card-border);
    margin-bottom: 16px;
  }

  .app-header h1 {
    font-size: 18px;
    margin: 0;
    color: var(--accent-blue);
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .card { 
    background: var(--card-bg); 
    border: 1px solid var(--card-border);
    border-radius: 14px; 
    padding: 16px; 
    margin-bottom: 14px; 
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -2px rgba(0, 0, 0, 0.3); 
  }

  h2 { 
    margin-top: 0; 
    color: var(--accent-blue); 
    font-size: 15px; 
    border-bottom: 1px solid var(--card-border); 
    padding-bottom: 8px; 
    display: flex;
    align-items: center;
    gap: 8px;
  }

  h3 { 
    color: #e2e8f0; 
    font-size: 14px; 
    margin-top: 16px; 
    margin-bottom: 8px; 
    border-left: 3px solid var(--accent-blue); 
    padding-left: 8px; 
  }

  label { 
    font-weight: 600; 
    font-size: 12px; 
    color: var(--text-secondary);
    display: block; 
    margin-top: 12px; 
    margin-bottom: 6px; 
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  input, select, textarea { 
    width: 100%; 
    padding: 11px 12px; 
    background-color: #0f172a;
    border: 1px solid var(--card-border); 
    border-radius: 8px; 
    box-sizing: border-box; 
    font-size: 13px; 
    color: var(--text-primary);
    outline: none;
    transition: all 0.2s ease;
    appearance: none;
    -webkit-appearance: none;
  }

  input[type="date"] {
    min-height: 43px;
    line-height: normal;
  }

  input:focus, select:focus, textarea:focus {
    border-color: var(--accent-blue);
    box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
  }
  
  .form-row { display: flex; gap: 10px; }
  .form-col { flex: 1; }

  .question-item { 
    border-bottom: 1px solid var(--card-border); 
    padding: 14px 0; 
    transition: all 0.2s ease; 
  }

  .question-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; gap: 8px; }
  .question-title { font-size: 13.5px; font-weight: 500; color: #f1f5f9; flex: 1; line-height: 1.4; }
  
  .btn-group { display: flex; gap: 8px; margin-bottom: 10px; }
  .btn-option { 
    flex: 1; 
    padding: 10px; 
    border: 1px solid var(--card-border); 
    background: #0f172a; 
    color: var(--text-secondary);
    border-radius: 8px; 
    font-size: 12px; 
    font-weight: 600; 
    cursor: pointer; 
    text-align: center; 
    transition: all 0.2s ease;
  }

  .btn-option.selected-uygun { background: #15803d; color: #fff; border-color: var(--success); box-shadow: 0 0 8px rgba(34, 197, 94, 0.3); }
  .btn-option.selected-degil { background: #b91c1c; color: #fff; border-color: var(--danger); box-shadow: 0 0 8px rgba(239, 68, 68, 0.3); }
  .btn-option.selected-na { background: #475569; color: #fff; border-color: #64748b; }
  
  .btn-hide { 
    background: #0f172a; 
    border: 1px solid var(--card-border); 
    color: var(--text-secondary); 
    border-radius: 6px; 
    padding: 5px 10px; 
    font-size: 11px; 
    cursor: pointer; 
    font-weight: 600; 
  }

  .item-hidden { opacity: 0.3; background: #0f172a; padding: 10px; border-radius: 8px; }
  .item-hidden .item-details { display: none !important; }

  .item-details { background: #0f172a; padding: 10px; border-radius: 8px; border: 1px dashed var(--card-border); margin-top: 10px; }
  .mini-photo-preview { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .mini-photo-preview img { width: 55px; height: 55px; object-fit: cover; border-radius: 6px; border: 1px solid var(--card-border); }

  .toggle-container { 
    display: flex; 
    align-items: center; 
    justify-content: space-between; 
    background: #0f172a; 
    padding: 10px 14px; 
    border-radius: 8px; 
    border: 1px solid var(--card-border);
    margin-bottom: 14px; 
    font-size: 12px; 
    font-weight: 600; 
    color: var(--accent-blue); 
  }

  .file-input-wrapper {
    position: relative;
    display: inline-block;
    width: 100%;
  }

  .file-input-btn {
    background: #0f172a;
    border: 1px dashed var(--accent-blue);
    color: var(--accent-blue);
    padding: 10px;
    border-radius: 8px;
    text-align: center;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    display: block;
    transition: all 0.2s ease;
  }

  .btn-submit { 
    background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); 
    color: #fff; 
    width: 100%; 
    border: none; 
    padding: 15px; 
    border-radius: 10px; 
    font-size: 15px; 
    font-weight: 700; 
    margin-top: 16px; 
    cursor: pointer; 
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
    transition: all 0.2s ease;
  }

  .btn-submit:active { transform: scale(0.98); }
  .hidden { display: none; }
</style>
</head>
<body>

<div class="app-header">
  <h1 id="anaBaslik">🛠️ RÖLÖVE / ALTYAPI TESPİTİ</h1>
</div>

<!-- 1. KÜNYE -->
<div class="card">
  <h2>1. Mağaza & Künye Bilgileri</h2>
  
  <div class="form-row">
    <div class="form-col">
      <label>Marka Adı</label>
      <input type="text" id="markaAdi" placeholder="Örn: Mavi, Zara, LCW">
    </div>
    <div class="form-col">
      <label>Mağaza Adı</label>
      <input type="text" id="magazaAdi" placeholder="Örn: Kartal Cadde">
    </div>
  </div>

  <div class="form-row">
    <div class="form-col">
      <label>Bölge / Şehir</label>
      <input type="text" id="bolgeBilgisi" placeholder="Örn: Marmara / İstanbul">
    </div>
    <div class="form-col">
      <label>Raporu Hazırlayan</label>
      <input type="text" id="raporuHazirlayan" placeholder="Ad Soyad / Unvan">
    </div>
  </div>

  <div class="form-row">
    <div class="form-col">
      <label>Saha Tespit Tarihi</label>
      <input type="date" id="tespitTarihi">
    </div>
    <div class="form-col">
      <label>Rapor Yayın Tarihi</label>
      <input type="date" id="yayinTarihi">
    </div>
  </div>

  <label>Denetim Aşaması</label>
  <select id="denetimAsamasi" onchange="ekranGuncelle()">
    <option value="roleve">1. Rölöve / Altyapı Tespiti</option>
    <option value="tavan_kapama">2. Tavan Kapama Öncesi Kontrol</option>
    <option value="teslim">3. Açılış / Geçici Kabul Kontrolü</option>
  </select>
</div>

<!-- 2. SİSTEM SEÇİMİ -->
<div class="card">
  <h2>2. Tesisat & Sistem Varlığı</h2>
  
  <label>İklimlendirme (HVAC) Tesisatı</label>
  <select id="hvacVar" onchange="ekranGuncelle()">
    <option value="var">Var</option>
    <option value="yok">Yok</option>
  </select>

  <div id="hvacDetayKutusu">
    <label>HVAC Sistem Tipi</label>
    <select id="hvacTipi" onchange="ekranGuncelle()">
      <option value="VRF">VRF Sistem</option>
      <option value="FCU">Fan-Coil (FCU)</option>
      <option value="WSHP">Su Kaynaklı Isı Pompası (WSHP)</option>
      <option value="Rooftop">Rooftop (Çatı Tipi)</option>
      <option value="Split">Split / Multi Klima</option>
    </select>
  </div>

  <label>Havalandırma & Egzoz Tesisatı</label>
  <select id="havalandirmaVar" onchange="ekranGuncelle()">
    <option value="var">Var</option>
    <option value="yok">Yok</option>
  </select>

  <label>Sprinkler Tesisatı</label>
  <select id="sprinklerVar" onchange="ekranGuncelle()">
    <option value="var">Var</option>
    <option value="yok">Yok</option>
  </select>

  <label>Yangın Dolabı Tesisatı</label>
  <select id="yanginDolabiVar" onchange="ekranGuncelle()">
    <option value="var">Var</option>
    <option value="yok">Yok</option>
  </select>

  <label>Sıhhi Tesisat & Drenaj</label>
  <select id="sihhiVar" onchange="ekranGuncelle()">
    <option value="var">Var</option>
    <option value="yok">Yok</option>
  </select>
</div>

<!-- 3. RÖLÖVE AŞAMASI -->
<div id="roleveBolumu" class="card hidden">
  <h2>3. Rölöve & Altyapı Tespiti</h2>
  <div id="roleveSorulariIcerik"></div>
</div>

<!-- 4. İMALAT KONTROLLERİ -->
<div id="imalatKontrolBolumu" class="card hidden">
  <h2>4. Saha İmalat Kontrolleri</h2>
  
  <div class="toggle-container">
    <span>Gizlenen Maddeleri Göster</span>
    <input type="checkbox" id="toggleHidden" onchange="gizlenenleriGosterToggle()" style="width:auto;">
  </div>

  <div id="imalatSorulari"></div>
</div>

<!-- 5. GENEL NOTLAR & FOTOĞRAFLAR -->
<div class="card">
  <h2>5. Genel Saha Fotoğrafları & Notlar</h2>
  <label>Genel Fotoğraflar</label>
  
  <div class="file-input-wrapper">
    <div class="file-input-btn">📷 Kamera ile Çek / 🖼️ Galeriden Fotoğraf Seç</div>
    <input type="file" accept="image/*" multiple onchange="genelFotoEkle(event)" style="position:absolute; top:0; left:0; opacity:0; width:100%; height:100%; cursor:pointer;">
  </div>
  
  <div id="genelFotoOnizleme" class="mini-photo-preview"></div>

  <label>Genel Notlar ve Aksiyonlar</label>
  <textarea id="genelNotlar" rows="3" placeholder="Saha genel gözlemlerinizi ve eksiklikleri giriniz..."></textarea>

  <button class="btn-submit" onclick="pdfOlustur()">📄 RAPORU YAZDIR / PDF OLUŞTUR</button>
</div>

<script>
document.getElementById("tespitTarihi").valueAsDate = new Date();
document.getElementById("yayinTarihi").valueAsDate = new Date();

const imalatSorulariVeri = {
  VRF: [
    "Bakır boru hatları, refnet montaj yönleri ve izolasyonlar uygun mu?",
    "Drenaj hatlarına min %1 eğim verildi ve su dökme akış testi yapıldı mı?",
    "Cihaz altı müdahale kapakları (min 50x50 cm) mimariye işlendi mi?",
    "Dış ünite taze hava/egzoz sirkülasyon mesafeleri yeterli mi?"
  ],
  FCU: [
    "Su borularında Hidrostatik Su Basınç Testi yapıldı mı?",
    "Motorlu vana, balans vanası ve pislik tutucu yönleri doğru mu?",
    "Drenaj tavası eğimi ve yoğuşma su testi yapıldı mı?",
    "Akustik izolasyonlu flex / silsusturucu montajı yapıldı mı?"
  ],
  WSHP: [
    "Kule/loop suyu hat çapı ve fleks bağlantıları uygun mu?",
    "Kondenser su hattında pislik tutucu takıldı mı?",
    "Gruplama uygun mu?",
    "Cihaz yaylı izolatör / takoz montajları yapıldı mı?"
  ],
  Rooftop: [
    "Üfleme/emiş kanalları ve taşyünü izolasyonları uygun mu?",
    "Yangın damperi (FD) mekanik montajı ve erişimi uygun mu?",
    "Cihaz kaidesi ve titreşim izolatörleri yerleştirildi mi?"
  ],
  Split: [
    "Dış ünite konsol sabitlemesi ve bakır boru dekoratif kanallaması uygun mu?",
    "Drenaj hattı ve besleme bağlantısı hazır mı?"
  ],
  Havalandirma: [
    "Kanal flanş/conta sızdırmazlığı ve izolasyonlar yapıldı mı?",
    "Yangın damperi şaft geçiş harcı ve mekanik montajı yapıldı mı?",
    "Menfez / anemostat hava dengesi ayarlandı mı?"
  ],
  Sprinkler: [
    "Sprinkler başlığı alt/üst tavan kot mesafeleri kurallara uygun mu?",
    "Yangın hattı hidrostatik basınç testi (12 Bar) yapıldı mı?",
    "Hat sonunda Test ve Drenaj Vana Grubu bırakıldı mı?",
    "Sismik askı ve sınırlayıcılar takıldı mı?"
  ],
  YanginDolabi: [
    "Yangın dolabı montaj yüksekliği ve vana erişimi uygun mu?",
    "Dolap besleme hattı basınç ve debisi yeterli mi?"
  ],
  Sihhi: [
    "Temiz su hatlarında sızdırmazlık/basınç testi (min 6 bar) yapıldı mı?",
    "Pis su hatlarında %2 eğim ve havalık hattı kurgusu uygun mu?",
    "Temiz su girişinde Sayaç ve Pislik Tutucu Süzgeç takıldı mı?",
    "Drenaj hattına su dökülerek akış testi yapıldı mı?",
    "Atık su pompası çekvalf ve seviye flatörü çalışıyor mu?"
  ]
};

let maddeVerileri = {};
let genelFotolar = [];

function ekranGuncelle() {
  const asamaSelect = document.getElementById("denetimAsamasi");
  const asama = asamaSelect.value;
  const secilenMetin = asamaSelect.options[asamaSelect.selectedIndex].text;
  
  // Üst başlığı seçilen metne göre dinamik olarak değiştiriyoruz
  document.getElementById("anaBaslik").innerText = "🛠️ " + secilenMetin.toUpperCase();

  const hvacVar = document.getElementById("hvacVar").value === "var";
  const havalandirmaVar = document.getElementById("havalandirmaVar").value === "var";
  const sprinklerVar = document.getElementById("sprinklerVar").value === "var";
  const yanginDolabiVar = document.getElementById("yanginDolabiVar").value === "var";
  const sihhiVar = document.getElementById("sihhiVar").value === "var";
  const hvacTipi = document.getElementById("hvacTipi").value;

  document.getElementById("hvacDetayKutusu").classList.toggle("hidden", !hvacVar);

  if (asama === "roleve") {
    document.getElementById("roleveBolumu").classList.remove("hidden");
    document.getElementById("imalatKontrolBolumu").classList.add("hidden");
    roleveSorulariniCiz();
  } else {
    document.getElementById("roleveBolumu").classList.add("hidden");
    document.getElementById("imalatKontrolBolumu").classList.remove("hidden");

    let sorular = [];
    if (hvacVar && imalatSorulariVeri[hvacTipi]) sorular = sorular.concat(imalatSorulariVeri[hvacTipi]);
    if (havalandirmaVar) sorular = sorular.concat(imalatSorulariVeri.Havalandirma);
    if (sprinklerVar) sorular = sorular.concat(imalatSorulariVeri.Sprinkler);
    if (yanginDolabiVar) sorular = sorular.concat(imalatSorulariVeri.YanginDolabi);
    if (sihhiVar) sorular = sorular.concat(imalatSorulariVeri.Sihhi);

    imalatSorulariniCiz(sorular);
  }
}

function roleveSorulariniCiz() {
  const container = document.getElementById("roleveSorulariIcerik");
  let html = "";
  const hvacVar = document.getElementById("hvacVar").value === "var";
  const hvacTipi = document.getElementById("hvacTipi").value;
  const havalandirmaVar = document.getElementById("havalandirmaVar").value === "var";
  const sprinklerVar = document.getElementById("sprinklerVar").value === "var";
  const sihhiVar = document.getElementById("sihhiVar").value === "var";

  if (hvacVar) {
    html += `<h3>HVAC Altyapı Tespiti (${hvacTipi})</h3>`;
    if (hvacTipi === "VRF") {
      html += `<label>Dış Ünite Konumu / Yeri Uygun mu?</label><select id="r_vrf_yer"><option>Uygun</option><option>Uygun Değil</option></select>`;
      html += `<label>Dış Ünite Lokasyon Detayı</label><input type="text" id="r_vrf_detay" placeholder="Örn: Çatı / AVM Şaftı">`;
    } else if (hvacTipi === "WSHP") {
      html += `<label>AVM Bırakılan Boru Çapı</label><input type="text" id="r_wshp_cap" placeholder="Örn: DN40">`;
      html += `<label>Gruplama Uygun mu?</label><select id="r_wshp_grup"><option>Uygun</option><option>Değil</option></select>`;
    } else if (hvacTipi === "FCU") {
      html += `<label>AVM Branşman Boru Çapı</label><input type="text" id="r_fcu_cap" placeholder="Örn: DN32">`;
      html += `<label>Çap ve Debi Yeterli mi?</label><select id="r_fcu_debi"><option>Yeterli</option><option>Yetersiz</option></select>`;
    } else if (hvacTipi === "Rooftop") {
      html += `<label>Çatı Kaide Alanı ve Şaft Geçiş Ölçüleri Uygun mu?</label><select id="r_rt_alan"><option>Uygun</option><option>Değil</option></select>`;
    } else if (hvacTipi === "Split") {
      html += `<label>Dış Ünite Konsol Yeri ve Bakır Boru Şaft Yolu Uygun mu?</label><select id="r_split_yer"><option>Uygun</option><option>Değil</option></select>`;
    }
  }

  if (havalandirmaVar) {
    html += `<h3>Havalandırma Branşman Tespiti</h3>`;
    html += `<label>Taze Hava Branşman Ölçüsü / Çapı</label><input type="text" id="r_hav_th_cap" placeholder="Örn: 400x200 mm">`;
    html += `<label>Taze Hava Debisi Yeterli mi?</label><select id="r_hav_th_debi"><option>Yeterli</option><option>Yetersiz</option></select>`;
    html += `<label>Egzoz Hava Branşman Ölçüsü / Çapı</label><input type="text" id="r_hav_eg_cap" placeholder="Örn: 300x200 mm">`;
    html += `<label>Egzoz Debisi Yeterli mi?</label><select id="r_hav_eg_debi"><option>Yeterli</option><option>Yetersiz</option></select>`;
  }

  if (sprinklerVar) {
    html += `<h3>Sprinkler Altyapı Tespiti</h3>`;
    html += `<label>Yangın Ana Branşman Çapı</label><input type="text" id="r_spr_cap" placeholder="Örn: DN50">`;
    html += `<label>Sprinkler Besleme Mimarisi</label><select id="r_spr_mimari"><option>Upright ve Pendent Aynı Hattan</option><option>Upright ve Pendent Ayrı Hatlardan</option><option>Sadece Pendent Hattı Var</option></select>`;
    html += `<label>Mevcut Sprinkler & Tavan Kot Uyum Durumu</label><select id="r_spr_kot"><option>Uygun</option><option>Revizyon Gerekli</option></select>`;
  }

  if (sihhiVar) {
    html += `<h3>Sıhhi Tesisat Tespiti</h3>`;
    html += `<label>Temiz Su Branşman Çapı & Basıncı</label><input type="text" id="r_sih_ts_cap" placeholder="Örn: DN20 - 3 Bar">`;
    html += `<label>Pis Su (Gider) Bağlantı Çapı</label><input type="text" id="r_sih_ps_cap" placeholder="Örn: Ø110 PVC">`;
    html += `<label>Pis Su Deşarj Kotu</label><select id="r_sih_kot"><option>Cazibeli Akışa Uygun</option><option>Atık Su Pompası Gerekli</option></select>`;
  }

  container.innerHTML = html || "<p style='font-size:13px; color:var(--text-secondary);'>Seçili sistem bulunmamaktadır.</p>";
}

function imalatSorulariniCiz(liste) {
  const container = document.getElementById("imalatSorulari");
  container.innerHTML = "";
  if (liste.length === 0) {
    container.innerHTML = "<p style='font-size:13px; color:var(--text-secondary);'>Seçilen sistemlere ait kontrol maddesi bulunmamaktadır.</p>";
    return;
  }

  liste.forEach((soru, index) => {
    const key = "im_" + index;
    if (!maddeVerileri[key]) {
      maddeVerileri[key] = { durum: 'Uygun', gizli: false, not: '', fotolar: [], soruText: soru };
    }

    const data = maddeVerileri[key];
    const div = document.createElement("div");
    div.className = "question-item " + (data.gizli ? "item-hidden" : "");
    div.id = "item_div_" + key;

    div.innerHTML = `
      <div class="question-header">
        <div class="question-title">${index + 1}. ${soru}</div>
        <button class="btn-hide" onclick="maddeGizleToggle('${key}')">${data.gizli ? '👁️ Göster' : '👁️ Gizle'}</button>
      </div>

      <div class="btn-group">
        <div class="btn-option ${data.durum === 'Uygun' ? 'selected-uygun' : ''}" id="${key}_u" onclick="cevapSec('${key}', 'Uygun')">Uygun</div>
        <div class="btn-option ${data.durum === 'Değil' ? 'selected-degil' : ''}" id="${key}_d" onclick="cevapSec('${key}', 'Değil')">Değil</div>
        <div class="btn-option ${data.durum === 'N/A' ? 'selected-na' : ''}" id="${key}_n" onclick="cevapSec('${key}', 'N/A')">N/A</div>
      </div>

      <div class="item-details">
        <input type="text" placeholder="Not / Saha Açıklaması..." value="${data.not}" onchange="maddeNotuGuncelle('${key}', this.value)">
        <div style="margin-top:8px;">
          <div class="file-input-wrapper">
            <div class="file-input-btn">📷 Fotoğraf Ekle (Kamera / Galeri)</div>
            <input type="file" accept="image/*" multiple onchange="maddeFotoEkle('${key}', event)" style="position:absolute; top:0; left:0; opacity:0; width:100%; height:100%; cursor:pointer;">
          </div>
        </div>
        <div id="foto_box_${key}" class="mini-photo-preview"></div>
      </div>
    `;

    container.appendChild(div);
    maddeFotolariniCiz(key);
  });

  gizlenenleriGosterToggle();
}

function cevapSec(key, secenek) {
  maddeVerileri[key].durum = secenek;
  document.getElementById(key + "_u").className = "btn-option " + (secenek === 'Uygun' ? 'selected-uygun' : '');
  document.getElementById(key + "_d").className = "btn-option " + (secenek === 'Değil' ? 'selected-degil' : '');
  document.getElementById(key + "_n").className = "btn-option " + (secenek === 'N/A' ? 'selected-na' : '');
}

function maddeGizleToggle(key) {
  maddeVerileri[key].gizli = !maddeVerileri[key].gizli;
  const div = document.getElementById("item_div_" + key);
  const btn = div.querySelector(".btn-hide");
  
  if (maddeVerileri[key].gizli) {
    div.classList.add("item-hidden");
    btn.innerText = "👁️ Göster";
  } else {
    div.classList.remove("item-hidden");
    btn.innerText = "👁️ Gizle";
  }
  gizlenenleriGosterToggle();
}

function gizlenenleriGosterToggle() {
  const hepsiGoster = document.getElementById("toggleHidden").checked;
  Object.keys(maddeVerileri).forEach(key => {
    const div = document.getElementById("item_div_" + key);
    if (div && maddeVerileri[key].gizli) {
      div.style.display = hepsiGoster ? "block" : "none";
    } else if (div) {
      div.style.display = "block";
    }
  });
}

function maddeNotuGuncelle(key, val) {
  maddeVerileri[key].not = val;
}

function maddeFotoEkle(key, e) {
  for (let file of e.target.files) {
    const reader = new FileReader();
    reader.onload = function(evt) {
      maddeVerileri[key].fotolar.push(evt.target.result);
      maddeFotolariniCiz(key);
    }
    reader.readAsDataURL(file);
  }
}

function maddeFotolariniCiz(key) {
  const box = document.getElementById("foto_box_" + key);
  if (!box) return;
  box.innerHTML = "";
  maddeVerileri[key].fotolar.forEach(f => {
    const img = document.createElement("img");
    img.src = f;
    box.appendChild(img);
  });
}

function genelFotoEkle(e) {
  for (let file of e.target.files) {
    const reader = new FileReader();
    reader.onload = function(evt) {
      genelFotolar.push(evt.target.result);
      const img = document.createElement("img");
      img.src = evt.target.result;
      img.style.width = "60px"; img.style.height = "60px"; img.style.objectFit = "cover"; img.style.borderRadius = "6px";
      document.getElementById("genelFotoOnizleme").appendChild(img);
    }
    reader.readAsDataURL(file);
  }
}

function tarihFormatla(tarihStr) {
  if (!tarihStr) return "Belirtilmedi";
  const d = new Date(tarihStr);
  return d.toLocaleDateString('tr-TR');
}

function pdfOlustur() {
  const magaza = document.getElementById("magazaAdi").value || "Belirtilmedi";
  const marka = document.getElementById("markaAdi").value || "Belirtilmedi";
  const bolge = document.getElementById("bolgeBilgisi").value || "Belirtilmedi";
  const hazirlayan = document.getElementById("raporuHazirlayan").value || "Belirtilmedi";
  const tespitTarihi = tarihFormatla(document.getElementById("tespitTarihi").value);
  const yayinTarihi = tarihFormatla(document.getElementById("yayinTarihi").value);
  const asamaValue = document.getElementById("denetimAsamasi").value;
  const asamaText = document.getElementById("denetimAsamasi").options[document.getElementById("denetimAsamasi").selectedIndex].text;
  
  let raporBasligi = asamaText.toUpperCase();

  let icerikHtml = "";

  if (asamaValue === "roleve") {
    icerikHtml += `<h3>Rölöve & Altyapı Tespiti Detayları</h3><ul>`;
    const inputs = document.querySelectorAll("#roleveSorulariIcerik label, #roleveSorulariIcerik input, #roleveSorulariIcerik select");
    for (let i = 0; i < inputs.length; i += 2) {
      if (inputs[i] && inputs[i+1]) {
        icerikHtml += `<li style="margin-bottom:6px;"><strong>${inputs[i].innerText}:</strong> ${inputs[i+1].value || 'Belirtilmedi'}</li>`;
      }
    }
    icerikHtml += `</ul>`;
  } else {
    icerikHtml += `<h3>Saha İmalat Kontrol Listesi</h3><table style="width:100%; border-collapse:collapse; margin-bottom:15px; font-size:12px;">
      <thead><tr style="background:#f1f5f9; color:#0f172a;"><th style="padding:8px; border:1px solid #ccc; text-align:left;">Kontrol Maddesi</th><th style="padding:8px; border:1px solid #ccc; width:100px;">Durum</th></tr></thead><tbody>`;
    
    Object.keys(maddeVerileri).forEach(key => {
      const data = maddeVerileri[key];
      if (!data.gizli) {
        const renk = data.durum === 'Uygun' ? '#16a34a' : (data.durum === 'Değil' ? '#dc2626' : '#475569');
        icerikHtml += `<tr>
          <td style="padding:8px; border:1px solid #ccc; color:#0f172a;">
            <strong>${data.soruText}</strong>
            ${data.not ? `<br><small style="color:#2563eb;">Not: ${data.not}</small>` : ''}`;
        
        if (data.fotolar.length > 0) {
          icerikHtml += `<br><div style="display:flex; gap:4px; margin-top:4px;">`;
          data.fotolar.forEach(f => {
            icerikHtml += `<img src="${f}" style="width:60px; height:45px; object-fit:cover; border-radius:3px; border:1px solid #ddd;">`;
          });
          icerikHtml += `</div>`;
        }

        icerikHtml += `</td>
          <td style="padding:8px; border:1px solid #ccc; font-weight:bold; color:${renk}; text-align:center;">${data.durum}</td>
        </tr>`;
      }
    });
    icerikHtml += `</tbody></table>`;
  }

  let fotoHtml = "";
  genelFotolar.forEach((f, i) => {
    fotoHtml += `<div style="margin:5px; text-align:center;"><img src="${f}" style="width:160px; height:120px; object-fit:cover; border:1px solid #ccc; border-radius:4px;"><br><small style="color:#0f172a;">Foto ${i+1}</small></div>`;
  });

  const win = window.open("", "_blank");
  win.document.write(`
    <html>
    <head><title>${raporBasligi} - ${magaza}</title></head>
    <body style="font-family:Arial, sans-serif; padding:20px; color:#0f172a; background:#fff;">
      <h2 style="text-align:center; color:#0f172a; margin-bottom:4px; text-transform:uppercase; border:none; padding:0;">${raporBasligi} RAPORU</h2>
      <hr style="border:0; border-top:1px solid #ccc;">
      <table style="width:100%; font-size:12px; margin-bottom:10px; border-collapse:collapse; color:#0f172a;">
        <tr>
          <td style="padding:4px;"><strong>Marka / Mağaza:</strong> ${marka} - ${magaza}</td>
          <td style="padding:4px;"><strong>Saha Tespit Tarihi:</strong> ${tespitTarihi}</td>
        </tr>
        <tr>
          <td style="padding:4px;"><strong>Bölge / Lokasyon:</strong> ${bolge}</td>
          <td style="padding:4px;"><strong>Rapor Yayın Tarihi:</strong> ${yayinTarihi}</td>
        </tr>
        <tr>
          <td style="padding:4px;"><strong>Denetim Aşaması:</strong> ${asamaText}</td>
          <td style="padding:4px;"><strong>Raporu Hazırlayan:</strong> ${hazirlayan}</td>
        </tr>
      </table>
      <hr style="border:0; border-top:1px solid #ccc;">
      ${icerikHtml}
      ${fotoHtml ? `<h3 style="color:#0f172a;">Genel Saha Fotoğrafları</h3><div style="display:flex; flex-wrap:wrap;">${fotoHtml}</div>` : ''}
      <h3 style="color:#0f172a;">Genel Notlar ve Aksiyonlar</h3>
      <p style="background:#f8fafc; padding:10px; border:1px solid #ddd; font-size:13px; color:#0f172a;">${document.getElementById("genelNotlar").value || 'Genel not girilmedi.'}</p>
    </body>
    </html>
  `);
  win.document.close();
  setTimeout(() => { win.print(); }, 500);
}

ekranGuncelle();
</script>
</body>
</html>
